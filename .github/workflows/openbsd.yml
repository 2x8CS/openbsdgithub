name: OpenBSD Full SSH Setup

on:
  push:
  workflow_dispatch:

jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OpenBSD VM with Auto Setup
        uses: vmactions/openbsd-vm@v1
        with:
          debug-on-error: true
          run: |
            set +e
            echo "🔧 إعداد OpenBSD VM..."

            # 1) كلمة السر الافتراضية: openbsd (من الصورة الأصلية - ما نحتاج نغيرها)
            echo "✅ root password: openbsd (افتراضية)"

            # 2) إعداد sshd للسماح بـ root
            echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config
            echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config
            pkill -HUP sshd
            echo "✅ SSH configured"

            # 3) مفتاحك العام
            mkdir -p /root/.ssh
            chmod 700 /root/.ssh
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKabR0ItQG3t0UFr9gk0QlL3OzkAtrfgNLkWJ9y4CWZk youssefhidour@youssefhidour-hpprobook640g1" > /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            echo "✅ SSH key added"

            # 4) اختبار SSH داخلي (BatchMode يمنع التعليق)
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes root@127.0.0.1 exit 2>/dev/null
            echo "✅ SSH internal test done"

            # 5) فتح النفق عبر Pinggy (sleep 15 بدلاً من 8)
            echo "🌐 Opening tunnel via Pinggy..."
            ssh -p 443 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=3 \
                -R0:localhost:22 \
                tcp@free.pinggy.io > /tmp/p.log 2>&1 &
            TUNNEL_PID=$!

            sleep 15
            echo ""
            echo "###########################################"
            echo "🔗 معلومات الاتصال SSH:"
            cat /tmp/p.log
            echo ""
            echo "🌐 VNC للدخول اليدوي (الرابط من الأعلى في الـ logs)"
            echo ""
            echo "🔑 بيانات الدخول عبر VNC:"
            echo "  login: root"
            echo "  password: openbsd"
            echo ""
            echo "💻 للدخول عبر SSH من جهازك:"
            echo "  ssh -p PORT root@HOST.free.pinggy.io"
            echo ""
            echo "📝 أوامر مفيدة:"
            echo "  pkg_add vim htop"
            echo "  touch ~/continue    # إنهاء الجلسة"
            echo "###########################################"

            # إبقاء النفق حي
            wait $TUNNEL_PID 2>/dev/null
            exit 1
