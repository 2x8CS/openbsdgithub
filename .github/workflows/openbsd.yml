name: Run OpenBSD System with SSH Access

on:
  push:
  workflow_dispatch:   # عشان تشغله يدوي من زر Run workflow

jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenBSD VM with SSH
        uses: vmactions/openbsd-vm@v1
        with:
          run: |
            set +e    # مهم: لا توقف السكربت عند أي خطأ

            echo "== 1) النظام =="
            uname -a

            echo "== 2) التأكد أن sshd شغال (موجود افتراضياً، لا تثبت شيء) =="
            pgrep -x sshd >/dev/null && echo "sshd already running" || /usr/sbin/sshd
            netstat -an | grep '\.22 '

            echo "== 3) إضافة مفتاحك العام للدخول كـ root =="
            mkdir -p /root/.ssh
            chmod 700 /root/.ssh
            echo "ssh-ed25519 AAAA... ضع مفتاحك العام هنا" >> /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys

            echo "== 4) فتح نفق للخارج باستخدام ssh الأساسي (بدون ngrok) =="
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
                -N -R 0:localhost:22 nokey@localhost.run > /tmp/tunnel.log 2>&1 &
            TUNNEL_PID=$!
            sleep 8
            cat /tmp/tunnel.log

            echo "== 5) طريقة الاتصال =="
            echo "من جهازك: ssh -p PORT root@localhost.run -i ~/.ssh/openbsd_vm"

            echo "== 6) إبقاء المهمة حية =="
            while kill -0 $TUNNEL_PID 2>/dev/null; do sleep 30; done
            exit 0    # مهم: ننهي بنجاح دائماً
