name: OpenBSD Web Terminal
on:
  push:
  workflow_dispatch:
jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          run: |
            set +e
            uname -a

            echo "== 1) تثبيت ttyd بحارس 120 ثانية (لا تعليق بعد اليوم) =="
            pkg_add ttyd &
            P=$!
            i=0
            while kill -0 $P 2>/dev/null && [ "$i" -lt 120 ]; do sleep 1; i=$((i+1)); done
            kill $P 2>/dev/null
            command -v ttyd || { echo "FAILED: ttyd not installed"; exit 0; }

            echo "== 2) تشغيل طرفية ويب على منفذ 7681 =="
            ttyd -i 127.0.0.1 -p 7681 ksh &
            sleep 2
            pgrep -x ttyd && echo "ttyd OK"

            echo "== 3) نفق HTTP مجاني (الذي ثبت أنه يعمل عندك) =="
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -N \
                -R 80:localhost:7681 nokey@localhost.run > /tmp/t.log 2>&1 &
            sleep 8
            cat /tmp/t.log

            echo "== 4) افتح رابط https الظاهر فوق في المتصفح =="
            while pgrep -f 'localhost.run' >/dev/null; do sleep 30; done
            exit 0
