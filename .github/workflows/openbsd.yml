name: OpenBSD Interactive Console

on:
  push:
  workflow_dispatch:

jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          debug-on-error: true     # الميزة الرسمية: VNC عند الفشل
          run: |
            set +e
            uname -a

            # 1) ضبط كلمة مرور لـ root عشان تدخل من الكونصول
            PASS="OpenBSD123!"
            HASH=$(encrypt -b "$PASS")
            usermod -p "$HASH" root
            echo "root password set"

            echo "=================================================="
            echo "  Login: root"
            echo "  Password: $PASS"
            echo "  لما تخلص اكتب داخل الـ VM: touch ~/continue"
            echo "=================================================="

            # 2) فشل متعمد عشان يفتح لك رابط VNC وينتظرك
            exit 1
