name: OpenBSD VM

on:
  push:
  workflow_dispatch:

jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          debug-on-error: true
          run: |
            echo "الـ VM جاهزة!"
            echo "بيانات الدخول:"
            echo "  login: root"
            echo "  password: openbsd"
            echo "عند الانتهاء اكتب: touch ~/continue"
            exit 1
