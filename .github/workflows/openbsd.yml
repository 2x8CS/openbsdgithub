name: Run OpenBSD System with SSH Access

on:
  push:
  workflow_dispatch:

jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenBSD VM with SSH
        uses: vmactions/openbsd-vm@v1
        with:
          run: |
            set +e
            uname -a

            # sshd موجود افتراضياً - لا تحاول تشغيله مرة ثانية
            pgrep -x sshd >/dev/null && echo "sshd OK" || /usr/sbin/sshd

            # مفتاحك الاحتياطي
            mkdir -p /root/.ssh && chmod 700 /root/.ssh
            echo "ssh-ed25519 AAAA... مفتاحك العام هنا" >> /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys

            echo "== الخطة أ: tmate =="
            pkg_add tmate
            if command -v tmate >/dev/null; then
              tmate -S /tmp/tmate new-session -d
              tmate -S /tmp/tmate wait tmate-ready
              echo "=============================================="
              echo "انسخ هذا الأمر والصقه في طرفيتك:"
              tmate -S /tmp/tmate display -p '#{tmate_ssh}'
              echo "أو افتح المتصفح على:"
              tmate -S /tmp/tmate display -p '#{tmate_web}'
              echo "=============================================="
              # المهمة تعيش ما دامت جلسة tmate مفتوحة
              while pgrep -x tmate >/dev/null; do sleep 30; done
            else
              echo "== الخطة ب: serveo =="
              ssh -o StrictHostKeyChecking=no -R 2222:localhost:22 serveo.net > /tmp/t.log 2>&1 &
              sleep 8
              cat /tmp/t.log
              echo "الاتصال: ssh -p 2222 root@serveo.net -i ~/.ssh/openbsd_vm"
              while pgrep -f 'serveo.net' >/dev/null; do sleep 30; done
            fi
            exit 0
