name: OpenBSD Full SSH Setup

on:
  push:
  workflow_dispatch:

jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OpenBSD VM with Auto Setup
        uses: vmactions/openbsd-vm@v1
        with:
          debug-on-error: true
          run: |
            set +e

            echo "🔧 إعداد OpenBSD VM..."

            # 1) كلمة سر لـ root
            echo 'root:openbsd' | chpass -i
            echo "✅ root password set: openbsd"

            # 2) إعداد sshd
            echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config
            echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config
            pkill -HUP sshd
            echo "✅ SSH configured"

            # 3) مفتاحك العام
            mkdir -p /root/.ssh
            chmod 700 /root/.ssh
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKabR0ItQG3t0UFr9gk0QlL3OzkAtrfgNLkWJ9y4CWZk youssefhidour@youssefhidour-hpprobook640g1" >> /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            echo "✅ SSH key added"

            # 4) اختبار SSH داخلي
            ssh -o StrictHostKeyChecking=no -o PasswordAuthentication=no root@127.0.0.1 exit && echo "✅ SSH test passed"

            # 5) فتح النفق عبر Pinggy
            echo "🌐 Opening tunnel..."
            ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
                -R0:localhost:22 tcp@free.pinggy.io > /tmp/p.log 2>&1 &

            sleep 8
            echo ""
            echo "###########################################"
            echo "🔗 معلومات الاتصال SSH:"
            cat /tmp/p.log
            echo ""
            echo "🌐 VNC للدخول اليدوي:"
            echo "  (الرابط من الأعلى في الـ logs)"
            echo ""
            echo "🔑 بيانات الدخول:"
            echo "  user: root"
            echo "  password: openbsd"
            echo ""
            echo "📝 أوامر مفيدة:"
            echo "  pkg_add vim htop    # تثبيت برامج"
            echo "  uname -a            # معلومات النظام"
            echo "  touch ~/continue    # إنهاء الجلسة"
            echo "###########################################"

            # فشل متعمد ليفتح VNC ويبقى شغال
            exit 1
