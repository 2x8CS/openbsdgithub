name: Run OpenBSD System with SSH Access

on: [push]

jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Run OpenBSD VM with SSH
        uses: vmactions/openbsd-vm@v1
        with:
          run: |
            # 1. التحقق من وجود SSH (موجود افتراضياً)
            which sshd
            ls -la /usr/sbin/sshd
            
            # 2. إنشاء مفاتيح SSH إذا ما موجودة
            if [ ! -f /etc/ssh/ssh_host_ed25519_key ]; then
              /usr/bin/ssh-keygen -A
            fi
            
            # 3. تشغيل SSH daemon
            /usr/sbin/sshd
            
            # 4. التحقق من أن SSH شغال
            ps aux | grep sshd
            
            # 5. تحميل ngrok
            cd /tmp
            ftp -o ngrok.tgz https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-openbsd-amd64.tgz
            tar xzf ngrok.tgz
            
            # 6. تشغيل ngrok
            ./ngrok tcp 22 &
            
            # 7. انتظار وعرض الرابط
            sleep 10
            echo "=== SSH Connection Info ==="
            ftp -o - http://localhost:4040/api/tunnels
            echo "==========================="
            
            # 8. إبقاء الـ workflow شغال
            echo "Waiting for SSH connection..."
            sleep 3600
