name: OpenBSD Desktop XFCE

on:
  push:
  workflow_dispatch:

jobs:
  openbsd_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OpenBSD VM with Desktop
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9-xfce"        # ← هنا السحر: صورة بواجهة رسومية
          debug-on-error: true
          run: |
            echo "🖥️ Desktop VM ready!"
            echo "افتح رابط VNC من فوق"
            echo "login: root"
            echo "password: openbsd"
            exit 1
